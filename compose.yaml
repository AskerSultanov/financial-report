services:
  app:
    container_name: report_app
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "5000"
    restart: unless-stopped
    networks:
      - front
    environment:
      - PORT=5000
      - HOST=0.0.0.0

      # - REPORT_LOADER_URL=
      # - REPORT_LOADER_URL_TO_RESUME_LOADING=
      # - REPORT_LOADER_URL_TO_RESUME_ABANDONED_LOADING=

      # - MONGO_URI=
      # - MONGO_AUTH_USER=
      # - MONGO_AUTH_PWD=
      # - MONGO_AUTH_DB=
      # - DB_NAME=
      # - MONGO_AUTH_MECHANISM=
      # - MONGO_KEY_ALT_NAME=
      # - MONGO_CRYPT_SHARED_PATH=
      # - MONGO_LOCAL_MASTER_KEY=
      # - KEY_VAULT_NAME_SPACE=
      # - KEY_VAULT_DATABASE_NAME=
      # - KEY_VAULT_COLLECTION_NAME=

      # - RABBITMQ_USER=
      # - RABBITMQ_PWD=
      # - RABBITMQ_PORT=
      # - RABBITMQ_HOST=

      # - ACCESS_TOKEN_TTL=
      # - REFRESH_TOKEN_TTL=
      # - ACCESS_TOKEN_SECRET=
      # - REFRESH_TOKEN_SECRET=

      # - SECRET_KEY=

      # - S3_REGION=
      # - S3_BUCKET_NAME=
      # - S3_ENDPOINT=
      # - S3_ACCESS_KEY_ID=
      # - S3_SECRET_ACCESS_KEY=

    volumes:
      - ./.env:/report_app/.env:ro

  nginx:
    image: nginx:stable-alpine3.24
    container_name: proxy
    networks:
      - front
    environment:
      - SITE
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/nginxconfig.io:/etc/nginx/nginxconfig.io:ro
      - ./nginx/sites-available/site.conf:/etc/nginx/sites-enabled/site.conf:ro

      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/_letsencrypt:/var/www/_letsencrypt:ro

networks:
  front:
