<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/index.css" type="text/css" />
    <link rel="stylesheet" href="/css/modalWindow.css" type="text/css" />
    <link rel="stylesheet" href="/css/loader.css" type="text/css" />
    <link rel="stylesheet" href="/css/uploadFilesModal.css" type="text/css" />
    <link rel="icon" href="../image/favicon.ico" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="/css/reportLoadingStatePanel.css"
      type="text/css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/vanillajs-datepicker@1.3.4/dist/css/datepicker.min.css"
    />
    <link rel="stylesheet" href="/css/datepicker-theme.css" type="text/css" />
    <title>Главная</title>
  </head>
  <body id="main">
    <div class="top-bar">
      <div class="top-actions" id="top-actions">
        <button id="tax-params-page">Налоги</button>
        <button id="goods-page">Товары</button>
        <button id="wb-token-page">Токен</button>
        <button id="period-button">Загрузить отчёты с токеном</button>
        <button id="upload-files-btn">Загрузить отчёты файлами</button>
        <button onclick="window.open('https://t.me/wbreportscanner', '_blank')">
          Вступить в группу Telegram
        </button>
      </div>
      <button id="logout-button" class="logout-button">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"
          />
        </svg>
        Выйти
      </button>
    </div>
    <div id="last-accounted-finances-report"></div>
    <div hidden id="report-loading-state-panel"></div>
    <div id="years_container" class="details"></div>
    <script src="/js/index/index.js" type="module"></script>
    <script>
      if (window.innerWidth < 768) {
        alert(
          "В настоящий момент сайт для\nмобильного устройства не адаптирован.\n\nПожалуйста, воспользуйтесь десктопным устройством.\n\nСпасибо.",
        );
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/vanillajs-datepicker@1.3.4/dist/js/datepicker-full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanillajs-datepicker@1.3.4/dist/js/locales/ru.js"></script>
  </body>
</html>
