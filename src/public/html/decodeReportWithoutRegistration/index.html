<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/css/loader.css" type="text/css" />
    <link rel="stylesheet" href="/css/modalWindow.css" type="text/css" />
    <link rel="stylesheet" href="/css/uploadFilesModal.css" type="text/css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/vanillajs-datepicker@1.3.4/dist/css/datepicker.min.css"
    />
    <link
      rel="stylesheet"
      href="/css/decodeReportWithoutRegistration.css"
      type="text/css"
    />
    <link rel="stylesheet" href="/css/datepicker-theme.css" type="text/css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Расшифровка финансового отчета wildberries без регистрации</title>
  </head>
  <body>
    <button id="decode-report-without-registration-button" type="button">
      Расшифровка отчета без регистрации
    </button>
    <div class="auth-buttons">
      <a href="/auth" id="auth" onclick="window.localStorage.clear()">Войти</a>
      <a href="/reg" id="registration" onclick="window.localStorage.clear()"
        >Регистрация</a
      >
    </div>
    <dialog id="dialog">
      <form>
        <div class="dialog-information">
          <section class="dialog-information-item">
            <h2>Какие права нужны</h2>
            <p>
              Для получения отчета необходим токен с категориями
              <strong>Финансы</strong>, <strong>Продвижение</strong> и
              <strong>Аналитика</strong>.
            </p>
          </section>
          <section class="dialog-information-item">
            <h2>Конфиденциальность</h2>
            <p>Введённый вами токен не сохраняется.</p>
          </section>
          <section class="dialog-information-item">
            <h2>Нет доверяете свой токен?</h2>
            <p>Вы можете загрузить файлы вместо токена.</p>
          </section>
        </div>
        <button type="button" id="upload-files-btn">Загрузить файлы</button>
        <label for="token">Введите токен</label>
        <input type="text" id="token" autofocus />
        <label for="dateFrom">Введите начало периода</label>
        <input type="text" id="dateFrom" placeholder="гггг-мм-дд" />
        <label for="dateTo">Введите конец периода</label>
        <input type="text" id="dateTo" placeholder="гггг-мм-дд" />
        <div class="dialog-actions">
          <button type="button" onclick="window.dialog.close()">Закрыть</button>
          <button type="button" id="get-report">Получить отчет</button>
          <button id="reset-report-button" class="top-btn">
            Обнулить отчет
          </button>
        </div>
      </form>
    </dialog>
    <div id="tables-container"></div>
    <button hidden id="download-report-as-xlsx-button">
      Скачать отчет как эксель
    </button>
    <script>
      src = "/js/report/resetReportButtonHandler.js";
      type = "module";
    </script>
    <script
      src="/js/decodeReportWithoutRegistration/index.js"
      type="module"
    ></script>
    <script
      src="/js/decodeReportWithoutRegistration/showReportIfExist.js"
      type="module"
    ></script>
    <script
      src="/js/decodeReportWithoutRegistration/decodeReportWithoutRegistrationButtonHandler.js"
      type="module"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/vanillajs-datepicker@1.3.4/dist/js/datepicker-full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanillajs-datepicker@1.3.4/dist/js/locales/ru.js"></script>
  </body>
</html>
