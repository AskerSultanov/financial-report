<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/goods.css" type="text/css" />
    <link rel="stylesheet" href="/css/upload.css" type="text/css" />
    <title>Товары</title>
  </head>
  <body>
    <!-- ============ AppBar ============ -->
    <header class="app-bar">
      <button class="btn-to-main" id="main">На главную</button>

      <h1 class="app-bar__title">Товары</h1>

      <div class="app-bar__actions">
        <!-- место под профиль/тему, пока заглушка -->
        <!-- <button class="icon-btn" type="button" aria-label="Профиль">👤</button> -->
      </div>
    </header>

    <!-- ============ Toolbar ============ -->
    <section class="toolbar" aria-label="Панель управления">
      <div class="toolbar__group">
        <button id="download-weekly-prices-file" type="button" hidden>
          Скачать цены на неделю
        </button>
        <button id="download-skus-metrics" type="button" hidden>
          Скачать статистику
        </button>
        <button
          id="upload-weekly-prices-and-discounts-file"
          type="button"
          hidden
        >
          Загрузить цены на неделю
        </button>
      </div>

      <div class="toolbar__group toolbar__group--right">
        <div id="week-days" hidden>
          <label for="week-days-select">День недели:</label>
          <select name="week-days" id="week-days-select">
            <option value="0">Пн</option>
            <option value="1">Вт</option>
            <option value="2">Ср</option>
            <option value="3">Чт</option>
            <option value="4">Пт</option>
            <option value="5">Сб</option>
            <option value="6">Вс</option>
          </select>
        </div>

        <button
          id="toggle-disabled-skus"
          class="icon-btn"
          type="button"
          aria-label="Настройки"
          hidden
        >
          ⚙
        </button>
      </div>
    </section>

    <!-- ============ Tabs ============ -->
    <nav class="tabs" aria-label="Переключение таблиц">
      <button
        id="switch-to-enabled"
        class="tab is-active"
        type="button"
        aria-selected="true"
      >
        Активные <span class="tab__count" id="enabled-count">0</span>
      </button>
      <button
        id="switch-to-disabled"
        class="tab"
        type="button"
        aria-selected="false"
      >
        Скрытые <span class="tab__count" id="disabled-count">0</span>
      </button>
    </nav>

    <!-- ============ Поиск / фильтр ============ -->
    <!-- <section class="filters" aria-label="Поиск и сортировка">
      <div class="filters__search">
        <span class="filters__search-icon" aria-hidden="true">🔍</span>
        <input
          id="skus-search"
          type="search"
          placeholder="Поиск по артикулу…"
          autocomplete="off"
        />
      </div>

      <div class="filters__sort">
        <label for="skus-sort">Сортировка:</label>
        <select id="skus-sort">
          <option value="sku">Артикул</option>
          <option value="price">Цена</option>
          <option value="discount">Скидка</option>
        </select>
      </div>
    </section> -->

    <!-- ============ Таблицы ============ -->
    <div class="table-scroll" id="enabled-skus-table-scroll">
      <table id="enabled-skus-table" class="skus-table" hidden>
        <thead id="enabled-skus-thead">
          <tr id="enabled-skus-thead-row">
            <th>Артикул</th>
            <th class="price-th" id="price-th" price-can-be-bifurcated>Цена</th>
            <th class="discount-th" discount-can-be-bifurcated>
              Скидка продавца
            </th>
            <th class="discountedPrice-th" discountedPrice-can-be-bifurcated>
              Цена со скидкой
            </th>
            <th
              class="clubDiscounted-price-th"
              clubDiscounted-can-be-bifurcated
            >
              Цена со скидкой, включая скидку WB Клуба
            </th>
            <th>Действие с ценой</th>
            <th>Скрыть товар</th>
          </tr>
        </thead>
        <tbody id="enabled-skus-tbody"></tbody>
      </table>
    </div>

    <div class="table-scroll" id="disabled-skus-table-scroll">
      <table id="disabled-skus-table" class="skus-table" hidden>
        <thead id="disabled-skus-thead">
          <tr>
            <th>Артикул</th>
            <th class="price-th" id="price-th" price-can-be-bifurcated>Цена</th>
            <th class="discount-th" discount-can-be-bifurcated>
              Скидка продавца
            </th>
            <th class="discountedPrice-th" discountedPrice-can-be-bifurcated>
              Цена со скидкой
            </th>
            <th
              class="clubDiscounted-price-th"
              clubDiscounted-can-be-bifurcated
            >
              Цена со скидкой, включая скидку WB Клуба
            </th>
            <th>Действие с ценой</th>
            <th>Включить товар</th>
          </tr>
        </thead>
        <tbody id="disabled-skus-tbody"></tbody>
      </table>
    </div>

    <!-- ============ Форма загрузки ============ -->
    <form enctype="multipart/form-data" id="upload-form" hidden>
      <label for="input-field" class="input-file">
        <input
          type="file"
          name="file"
          id="input-field"
          multiple
          accept="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        />
      </label>
    </form>
    <button id="upload-list-goods" type="button" hidden>
      Загрузить список товаров
    </button>
    <script src="/js/goods/index.js" type="module"></script>
  </body>
</html>
